name: Transfer regression
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_mb:
        description: Large browser fixture size in MiB
        type: choice
        default: '2050'
        options: ['512', '2050', '4096']

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check committed embedded assets
        shell: bash
        run: |
          git status --short -- internal/webui/assets
          test -z "$(git status --porcelain -- internal/webui/assets)"

  transfer:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: go test -race ./internal/... ./cmd/...
      - run: python tests/transfer_cli.py
      - run: node --test tests/cli-large.test.cjs
      - run: node --test tests/release.test.cjs
      - if: runner.os != 'macOS'
        run: node --test tests/browser.test.cjs
      - if: runner.os != 'macOS'
        run: node --test tests/launchers.test.cjs
      - name: Build release artifact
        shell: bash
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: mkdir -p dist && go build -trimpath -ldflags "-s -w -X github.com/winezer0/okserver/internal/buildinfo.Version=$BUILD_VERSION" -o dist/okserver-${{ runner.os }}-${{ runner.arch }}${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/okserver
      - uses: actions/upload-artifact@v4
        with:
          name: okserver-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  large-browser:
    if: github.event_name == 'workflow_dispatch'
    needs: [frontend, transfer]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: node --test tests/browser.test.cjs
        env:
          OKSERVER_BROWSER_MB: ${{ inputs.browser_mb }}
          OKSERVER_MEASURE_RESOURCES: '1'
      - run: node --test tests/cli-large.test.cjs
        env:
          OKSERVER_CLI_MB: ${{ inputs.browser_mb }}
      - run: go test ./cmd/okserver -run TestGeneratedLargeFileRecovery -count=1 -v
        env:
          OKSERVER_LARGE_TEST_MB: '512'
      - name: Five minute concurrent transfer soak
        run: go test -race ./internal/server -run '^TestHTTPTransferStress$' -count=1 -v
        env:
          OKSERVER_STRESS_SECONDS: '300'

  macos-validation:
    if: ${{ always() && needs.frontend.result == 'success' && needs.transfer.result == 'success' && (needs.large-browser.result == 'success' || needs.large-browser.result == 'skipped') }}
    needs: [frontend, transfer, large-browser]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - name: Install Chromium
        run: brew install --cask google-chrome
      - run: go test -race ./internal/... ./cmd/...
      - run: python tests/transfer_cli.py
      - run: node --test tests/release.test.cjs
      - run: node --test tests/browser.test.cjs
      - run: node --test tests/launchers.test.cjs
      - name: Build release artifact
        shell: bash
        run: mkdir -p dist && go build -trimpath -ldflags "-s -w" -o dist/okserver-darwin-${{ runner.arch }} ./cmd/okserver
      - uses: actions/upload-artifact@v4
        with:
          name: okserver-macos-${{ runner.arch }}
          path: dist/*
